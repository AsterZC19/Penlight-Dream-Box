# MongoDB 最小内存配置，配合 systemd 部署使用
# 768MB VPS: cacheSizeGB 0.25，空闲约 250MB

storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  bindIp: 127.0.0.1
  port: 27017

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
