[package]
name = "penlight-dream-box"
version = "0.2.1"
edition = "2021"
description = "Penlight Dream Box — Garupa event & monthly ranking API aggregator. Consumes Penlight-Dream-API over HTTP, persists snapshots to MongoDB, and serves a GarupaSpeedTracker-compatible API for Garupa-T10."
license = "MIT"

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "deflate", "brotli", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
mongodb = "3"
bson = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"
futures = "0.3"

[profile.release]
lto = true
